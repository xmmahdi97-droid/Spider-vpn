
name: Build Spider Xray Engine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CGO_ENABLED: "1"

    steps:
      - name: Checkout libXray
        uses: actions/checkout@v4
        with:
          repository: XTLS/libXray
          path: libXray

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true

      - name: Build Android libXray
        working-directory: libXray
        run: python3 build/main.py android

      - name: Prepare Android artifacts
        run: |
          mkdir -p dist/android
          cp libXray/libXray.aar dist/android/
          cp libXray/libXray-sources.jar dist/android/

      - name: Upload Xray Engine
        uses: actions/upload-artifact@v4
        with:
          name: Spider-Xray-Android
          path: dist/android/
          if-no-files-found: error
          
